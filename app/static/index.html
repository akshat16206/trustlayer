<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustLayer | Real-Time Hallucination Firewall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --code-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .tagline {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
    }

    .header-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .header-links a:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .presets {
      display: flex;
      gap: 0.5rem;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      color: #fff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    textarea, input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
      transition: all 0.2s;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .row-config {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-run {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: all 0.2s;
    }

    .btn-run:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }

    .btn-run:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Results styling */
    .status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      text-transform: uppercase;
    }

    .badge-PASS { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-FLAG { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-BLOCK { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    .score-container {
      text-align: right;
    }

    .score-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .markup-display {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.8;
      min-height: 120px;
    }

    .claim-entailed {
      background-color: rgba(16, 185, 129, 0.2) !important;
      color: #6ee7b7 !important;
      border-radius: 4px;
      padding: 2px 6px;
      border-bottom: 2px solid #10b981 !important;
      cursor: pointer;
    }

    .claim-neutral {
      background-color: rgba(245, 158, 11, 0.2) !important;
      color: #fde68a !important;
      border-radius: 4px;
      padding: 2px 6px;
      border-bottom: 2px solid #f59e0b !important;
      cursor: pointer;
    }

    .claim-contradiction {
      background-color: rgba(239, 68, 68, 0.2) !important;
      color: #fca5a5 !important;
      border-radius: 4px;
      padding: 2px 6px;
      border-bottom: 2px solid #ef4444 !important;
      cursor: pointer;
    }

    .claims-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .claim-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .claim-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .claim-text {
      font-weight: 500;
      color: var(--text);
    }

    .evidence-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid var(--primary);
      padding: 0.5rem 0.75rem;
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-style: italic;
    }

    .meter-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .meter-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 9999px;
    }

    .latency-bar {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      padding-top: 0.5rem;
      border-top: 1px solid var(--card-border);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.75rem;
      color: var(--text-muted);
      height: 250px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.9c-3.11-1.07-5.54-4.63-5.91-8.9h11.82c-.37 4.27-2.8 7.83-5.91 8.9z"/></svg>
      </div>
      <h1>TrustLayer</h1>
      <span class="tagline">v0.2.0 • Real-Time Hallucination Firewall</span>
    </div>
    <div class="header-links">
      <a href="/docs" target="_blank">Swagger API Docs &rarr;</a>
    </div>
  </header>

  <main>
    <!-- Left Input Panel -->
    <div class="panel">
      <div class="panel-header">
        <h2>Input Context & LLM Response</h2>
        <div class="presets">
          <button class="preset-btn" onclick="loadPreset('accurate')">Accurate</button>
          <button class="preset-btn" onclick="loadPreset('hallucinated')">Hallucinated</button>
          <button class="preset-btn" onclick="loadPreset('contradicted')">Contradicted</button>
        </div>
      </div>

      <div class="form-group">
        <label for="ragContext">Retrieved RAG Source Documents</label>
        <textarea id="ragContext" rows="7" placeholder="Paste source documents or context retrieved from vector database..."></textarea>
      </div>

      <div class="form-group">
        <label for="llmResponse">Generated LLM Response to Validate</label>
        <textarea id="llmResponse" rows="5" placeholder="Paste the candidate response generated by your language model..."></textarea>
      </div>

      <div class="row-config">
        <div class="form-group">
          <label for="policySelect">Guardrail Policy</label>
          <select id="policySelect">
            <option value="BALANCED" selected>Balanced (Standard)</option>
            <option value="STRICT">Strict (Zero Hallucination)</option>
            <option value="LENIENT">Lenient (High Tolerance)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filterCheckbox" style="margin-bottom:0.85rem;">Filter Response</label>
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-size:0.85rem; color:var(--text);">
            <input type="checkbox" id="filterCheckbox" style="width:auto; cursor:pointer;" />
            Strip ungrounded claims
          </label>
        </div>
      </div>

      <button id="runBtn" class="btn-run" onclick="runEvaluation()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Inspect with Firewall
      </button>
    </div>

    <!-- Right Results Panel -->
    <div class="panel" id="resultsPanel">
      <div class="panel-header">
        <h2>Verification & Trust Firewall Verdict</h2>
      </div>

      <div id="emptyResult" class="empty-state">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:0.4;"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p>Run evaluation to inspect atomic claims, semantic evidence matching, and NLI verification scores.</p>
      </div>

      <div id="resultsContent" style="display:none; flex-direction:column; gap:1.25rem;">
        <div class="status-banner">
          <div>
            <span id="badgeVerdict" class="status-badge">PASS</span>
            <div id="summaryText" style="margin-top:0.4rem; font-size:0.825rem; color:var(--text-muted); max-width:400px;"></div>
          </div>
          <div class="score-container">
            <div class="score-value" id="scoreValue">98%</div>
            <div class="score-label">Trust Score</div>
          </div>
        </div>

        <div>
          <label>Annotated Response (Interactive Highlighting)</label>
          <div class="markup-display" id="markupDisplay"></div>
        </div>

        <div id="filteredContainer" style="display:none;">
          <label>Sanitized Output (Filtered Truth)</label>
          <div class="markup-display" id="filteredDisplay" style="color:#6ee7b7; border-color:rgba(16,185,129,0.3);"></div>
        </div>

        <div>
          <label>Granular Claim Breakdown</label>
          <div class="claims-list" id="claimsList"></div>
        </div>

        <div class="latency-bar" id="latencyBar"></div>
      </div>
    </div>
  </main>

  <script>
    const PRESETS = {
      accurate: {
        context: "The James Webb Space Telescope (JWST) was launched on December 25, 2021, aboard an Ariane 5 rocket from Kourou, French Guiana. JWST operates in a halo orbit around the Sun-Earth L2 Lagrange point, approximately 1.5 million kilometers (930,000 miles) from Earth.",
        response: "The James Webb Space Telescope was successfully launched on December 25, 2021. It orbits around the Sun-Earth L2 Lagrange point, roughly 1.5 million kilometers from our planet."
      },
      hallucinated: {
        context: "The James Webb Space Telescope (JWST) was launched on December 25, 2021, aboard an Ariane 5 rocket from Kourou, French Guiana. JWST operates in a halo orbit around the Sun-Earth L2 Lagrange point.",
        response: "The James Webb Space Telescope launched in late 2021. In March 2023, it discovered living microbial fossils on Mars, which was confirmed by NASA headquarters."
      },
      contradicted: {
        context: "The James Webb Space Telescope was launched in December 2021 on an Ariane 5 rocket from French Guiana. It is strictly an infrared observatory.",
        response: "The James Webb Space Telescope was launched in 2015 from Cape Canaveral, Florida on a Falcon Heavy rocket."
      }
    };

    function loadPreset(key) {
      const p = PRESETS[key];
      if (!p) return;
      document.getElementById('ragContext').value = p.context;
      document.getElementById('llmResponse').value = p.response;
    }

    async function runEvaluation() {
      const contextText = document.getElementById('ragContext').value.trim();
      const responseText = document.getElementById('llmResponse').value.trim();
      const policy = document.getElementById('policySelect').value;
      const filter = document.getElementById('filterCheckbox').checked;

      if (!responseText) {
        alert("Please enter a generated LLM response to evaluate.");
        return;
      }

      const runBtn = document.getElementById('runBtn');
      runBtn.disabled = true;
      runBtn.innerText = "Evaluating Truth Firewall...";

      try {
        const payload = {
          request_id: "req_" + Date.now(),
          generated_text: responseText,
          retrieved_contexts: [
            {
              doc_id: "doc_1",
              text: contextText || "No context provided."
            }
          ],
          strictness: policy,
          filter_hallucinations: filter
        };

        const res = await fetch("/api/v1/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status + ": " + (await res.text()));
        }

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        alert("Evaluation error: " + err.message);
      } finally {
        runBtn.disabled = false;
        runBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Inspect with Firewall`;
      }
    }

    function renderResults(data) {
      document.getElementById('emptyResult').style.display = 'none';
      const content = document.getElementById('resultsContent');
      content.style.display = 'flex';

      // Verdict & Score
      const badge = document.getElementById('badgeVerdict');
      badge.textContent = data.action;
      badge.className = "status-badge badge-" + data.action;

      const pct = Math.round(data.trust_score * 100);
      const scoreVal = document.getElementById('scoreValue');
      scoreVal.textContent = pct + "%";
      scoreVal.style.color = data.action === 'PASS' ? 'var(--success)' : (data.action === 'FLAG' ? 'var(--warning)' : 'var(--danger)');

      document.getElementById('summaryText').textContent = data.summary || "";

      // Highlighted HTML
      document.getElementById('markupDisplay').innerHTML = data.highlighted_html || data.generated_text;

      // Filtered text if available
      const filtContainer = document.getElementById('filteredContainer');
      if (data.filtered_text) {
        filtContainer.style.display = 'block';
        document.getElementById('filteredDisplay').textContent = data.filtered_text;
      } else {
        filtContainer.style.display = 'none';
      }

      // Claims List
      const claimsList = document.getElementById('claimsList');
      claimsList.innerHTML = "";

      (data.claim_evaluations || []).forEach(c => {
        const card = document.createElement('div');
        card.className = "claim-card";
        
        let color = c.verdict === 'ENTAILMENT' ? 'var(--success)' : (c.verdict === 'NEUTRAL' ? 'var(--warning)' : 'var(--danger)');
        let evSnippet = c.evidence ? `Doc [${c.evidence.doc_id}] (similarity: ${(c.evidence.similarity_score * 100).toFixed(0)}%): "${c.evidence.text}"` : "No matching source evidence retrieved.";

        card.innerHTML = `
          <div class="claim-card-header">
            <span style="font-weight:700; color:${color}; font-size:0.75rem;">${c.verdict} • ${(c.confidence * 100).toFixed(1)}% CONFIDENCE</span>
            <span style="color:var(--text-muted); font-size:0.75rem;">Claim #${c.claim_id}</span>
          </div>
          <div class="claim-text">"${c.claim}"</div>
          <div class="evidence-box">${evSnippet}</div>
          <div class="meter-row">
            <span>Entailment: ${(c.scores.entailment * 100).toFixed(0)}%</span>
            <div class="meter-bar"><div class="meter-fill" style="width:${c.scores.entailment * 100}%; background:var(--success);"></div></div>
            <span>Contradiction: ${(c.scores.contradiction * 100).toFixed(0)}%</span>
            <div class="meter-bar"><div class="meter-fill" style="width:${c.scores.contradiction * 100}%; background:var(--danger);"></div></div>
          </div>
        `;
        claimsList.appendChild(card);
      });

      // Latency breakdown
      const lat = data.latency;
      if (lat) {
        document.getElementById('latencyBar').innerHTML = `
          <span>Extr: ${lat.extraction_ms}ms</span>
          <span>Retr: ${lat.retrieval_ms}ms</span>
          <span>NLI: ${lat.nli_ms}ms</span>
          <span>Agg: ${lat.aggregation_ms}ms</span>
          <span style="color:var(--text); font-weight:600;">Total: ${lat.total_ms}ms</span>
        `;
      }
    }

    // Load initial accurate preset on page open
    window.onload = () => loadPreset('accurate');
  </script>
</body>
</html>
